name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the running job irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the others.
      fail-fast: false
      matrix:
        # MSVC is the one compiler that rejects C the others accept, and a
        # Helix user on Windows compiles src/scanner.c themselves.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: npm

      - run: npm ci

      # One platform only: git normalises line endings on the Windows
      # checkout and reports the whole file as changed.
      - name: Generated parser is up to date
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/check-generated.sh

      # Compiles src/scanner.c, the only hand-written C here.
      - name: Test
        run: npx tree-sitter test

      - name: Grammar parses its own Boo script
        run: npx tree-sitter parse scripts/bumpversion.boo

  corpus:
    name: parse rate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: npm

      - run: npm ci

      # The grammar tracks current syntax, so this wants the tip of master.
      - name: Clone the compiler for its .boo corpus
        run: git clone --depth 1 https://github.com/mattmc3/boo boo

      - name: Parse rate
        run: ./scripts/parse-rate.sh boo
